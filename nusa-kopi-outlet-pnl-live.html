<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nusa Kopi — Outlet Contribution Analysis FY2025</title>
<meta name="description" content="Live outlet contribution analysis for Nusa Kopi Group Sdn Bhd, FY2025, read directly from the Outlet P&amp;L tab of the finance pack.">
<style>
/* ─────────────────────────────────────────────────────────────
   Board pack: committed to a light surface so it prints as one
   document. Palette validated for CVD separation on #ffffff.
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme: light;

  --plane:#f4f4f1;
  --surface:#ffffff;
  --surface-2:#fafaf8;
  --surface-3:#f0f0ec;

  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;

  --rule:#e4e3dd;
  --rule-2:#cfcec7;
  --rule-3:#b3b2aa;

  /* categorical — format identity (validated all-pairs, light/#fff) */
  --fmt-flagship:#2a78d6;
  --fmt-standard:#eb6834;
  --fmt-kiosk:#1baf7a;
  /* 4th slot, adjacent-validated, used only in the cost stack */
  --cost-1:#2a78d6;
  --cost-2:#eb6834;
  --cost-3:#1baf7a;
  --cost-4:#eda100;

  --neutral-mark:#c9c8c1;

  /* status — reserved, never a series */
  --good:#0ca30c;
  --warning:#fab219;
  --critical:#d03b3b;
  --critical-ink:#a3302f;
  --good-ink:#006300;
  --good-wash:#eef6ee;
  --critical-wash:#fceceb;
  --warn-wash:#fdf5e3;

  --grid:#ebeae4;
  --axis:#c3c2b7;

  --f-body:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow:0 1px 1px rgba(11,11,11,.04), 0 10px 28px -22px rgba(11,11,11,.30);
  --maxw:1360px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--plane);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}

.wrap{max-width:var(--maxw); margin:0 auto; padding:28px 24px 72px}

/* ── Title block ───────────────────────────────────────────── */
.masthead{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:26px 30px;
  display:flex;
  flex-wrap:wrap;
  gap:24px;
  align-items:flex-start;
  justify-content:space-between;
}
.masthead .eyebrow{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); font-weight:600; margin:0 0 8px;
}
.masthead h1{
  margin:0; font-size:27px; line-height:1.18; font-weight:650; letter-spacing:-.015em;
}
.masthead .sub{
  margin:6px 0 0; font-size:16px; color:var(--ink-2); font-weight:500;
}
.masthead .meta{
  margin:14px 0 0; font-size:12.5px; color:var(--ink-2);
  display:flex; flex-wrap:wrap; gap:6px 18px;
}
.masthead .meta b{font-weight:600; color:var(--ink)}
.masthead .identity{flex:1 1 420px; min-width:0}
.controls{flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:10px}
button#refresh{
  font:inherit; font-weight:600; font-size:13px;
  padding:9px 18px; border-radius:7px; cursor:pointer;
  border:1px solid var(--rule-2); background:var(--surface);
  color:var(--ink); transition:background .12s ease, border-color .12s ease;
  display:inline-flex; align-items:center; gap:8px;
}
button#refresh:hover:not(:disabled){background:var(--surface-3); border-color:var(--rule-3)}
button#refresh:disabled{opacity:.55; cursor:progress}
button#refresh .spin{
  width:12px; height:12px; border-radius:50%;
  border:2px solid var(--rule-2); border-top-color:var(--ink-2);
  display:none;
}
button#refresh.loading .spin{display:inline-block; animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp{font-size:12px; color:var(--muted); text-align:right}
.stamp b{color:var(--ink-2); font-weight:600}

/* ── State panels ──────────────────────────────────────────── */
.panel{
  margin-top:20px; border-radius:10px; padding:22px 26px;
  border:1px solid var(--rule); background:var(--surface); box-shadow:var(--shadow);
}
.panel h2{margin:0 0 8px; font-size:16px; font-weight:650}
.panel p{margin:0 0 10px; color:var(--ink-2); max-width:78ch}
.panel ul{margin:8px 0 0; padding-left:20px; color:var(--ink-2)}
.panel li{margin:5px 0}
.panel code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px; background:var(--surface-3); padding:2px 6px; border-radius:4px;
  border:1px solid var(--rule);
}
.panel.error{border-left:3px solid var(--critical); background:var(--surface)}
.panel.setup{border-left:3px solid var(--warning)}
.panel .tag{
  display:inline-block; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:700; margin-bottom:10px;
}
.panel.error .tag{color:var(--critical-ink)}
.panel.setup .tag{color:#8a5f00}

#loading{
  margin-top:20px; padding:56px 26px; text-align:center;
  color:var(--muted); font-size:13.5px;
  border:1px dashed var(--rule-2); border-radius:10px; background:var(--surface-2);
}

/* Refetch: hold the previous render, no skeleton flash */
#report.stale{opacity:.45; transition:opacity .15s ease}

/* ── Sections & cards ──────────────────────────────────────── */
.section-head{
  margin:34px 0 14px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.section-head .n{
  font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--muted);
  border:1px solid var(--rule-2); border-radius:4px; padding:2px 7px; line-height:1.6;
}
.section-head h2{margin:0; font-size:17px; font-weight:650; letter-spacing:-.01em}
.section-head p{margin:0; font-size:13px; color:var(--ink-2); flex:1 1 320px}

.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow); padding:20px 22px;
}
.card h3{margin:0 0 3px; font-size:14.5px; font-weight:650}
.card .note{margin:0 0 14px; font-size:12.5px; color:var(--ink-2)}
.grid{display:grid; gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g2,.g3{grid-template-columns:1fr}}

/* ── KPI tiles ─────────────────────────────────────────────── */
.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; margin-top:20px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{
  background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  box-shadow:var(--shadow); padding:16px 18px 15px; display:flex; flex-direction:column; gap:3px;
}
.kpi .label{
  font-size:11px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--muted); font-weight:650;
}
.kpi .value{font-size:25px; font-weight:640; letter-spacing:-.02em; line-height:1.22}
.kpi .value.small{font-size:21px}
.kpi .sub{font-size:12px; color:var(--ink-2)}
.kpi .breakdown{display:flex; gap:12px; flex-wrap:wrap; margin-top:4px; font-size:12px; color:var(--ink-2)}
.kpi .breakdown span{display:inline-flex; align-items:center; gap:5px}

.swatch{width:9px; height:9px; border-radius:2px; display:inline-block; flex:none}
.sw-flagship{background:var(--fmt-flagship)}
.sw-standard{background:var(--fmt-standard)}
.sw-kiosk{background:var(--fmt-kiosk)}

/* ── Legend ────────────────────────────────────────────────── */
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin:0 0 12px; font-size:12px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}

/* ── Charts ────────────────────────────────────────────────── */
.chartbox{position:relative; width:100%}
.chartbox canvas{display:block; width:100% !important}

/* ── Tables ────────────────────────────────────────────────── */
.tablewrap{overflow-x:auto; border:1px solid var(--rule); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:12.5px}
thead th{
  position:sticky; top:0; z-index:2;
  background:var(--surface-3); color:var(--ink-2);
  font-weight:650; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
  text-align:right; padding:10px 11px; white-space:nowrap;
  border-bottom:1px solid var(--rule-2); cursor:pointer; user-select:none;
}
thead th:first-child, thead th.txt{text-align:left}
thead th:hover{background:#e9e8e2; color:var(--ink)}
thead th .arrow{opacity:.32; margin-left:5px; font-size:10px}
thead th.sorted{color:var(--ink); background:#e9e8e2}
thead th.sorted .arrow{opacity:1}
tbody td{
  padding:9px 11px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums;
}
tbody td.txt{text-align:left; font-variant-numeric:normal}
tbody td.wrap{white-space:normal}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.best td{background:var(--good-wash)}
tbody tr.best:hover td{background:#e6f2e6}
tbody tr.flagged td{background:var(--critical-wash)}
tbody tr.flagged:hover td{background:#f9e2e0}
tbody tr.flagged td.code, tbody tr.flagged td.contrib{color:var(--critical-ink); font-weight:650}
tbody tr.best td.code, tbody tr.best td.contrib{color:var(--good-ink); font-weight:650}
.mark{font-size:11px; margin-right:5px}
.code-cell{display:inline-flex; align-items:center; gap:7px}

.simple-table td{border-bottom:1px solid var(--rule); padding:9px 11px}
.simple-table tr:last-child td{border-bottom:none}

/* ── Flags / pills ─────────────────────────────────────────── */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:650; padding:2px 8px; border-radius:20px;
  border:1px solid transparent; white-space:nowrap;
}
.pill.ok{background:var(--good-wash); color:var(--good-ink); border-color:#cfe4cf}
.pill.warn{background:var(--warn-wash); color:#8a5f00; border-color:#efdcae}
.pill.bad{background:var(--critical-wash); color:var(--critical-ink); border-color:#f0cdca}

/* ── Concentration bars ────────────────────────────────────── */
.conc-row{margin:0 0 18px}
.conc-row:last-child{margin-bottom:0}
.conc-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
.conc-head .t{font-size:13px; font-weight:600}
.conc-head .v{font-size:19px; font-weight:640; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.conc-bar{display:flex; height:26px; border-radius:5px; overflow:hidden; gap:2px; background:var(--surface)}
.conc-bar i{display:block; height:100%}
.conc-bar i.top{background:var(--fmt-flagship)}
.conc-bar i.rest{background:var(--neutral-mark)}
.conc-foot{display:flex; justify-content:space-between; margin-top:6px; font-size:11.5px; color:var(--ink-2)}

/* ── Observations ──────────────────────────────────────────── */
.obs{display:grid; gap:16px}
.obs article{
  background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--fmt-flagship);
  border-radius:8px; box-shadow:var(--shadow); padding:18px 22px;
}
.obs article.sev-warn{border-left-color:var(--warning)}
.obs article.sev-bad{border-left-color:var(--critical)}
.obs article.sev-good{border-left-color:var(--good)}
.obs h3{margin:0 0 2px; font-size:15px; font-weight:650; letter-spacing:-.01em}
.obs .kicker{
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:700; color:var(--muted); margin:0 0 6px;
}
.obs .body{margin:0; color:var(--ink-2); font-size:13.5px; max-width:96ch}
.obs .body b{color:var(--ink); font-weight:640; font-variant-numeric:tabular-nums}
.obs .ask{
  margin:11px 0 0; padding-top:10px; border-top:1px solid var(--rule);
  font-size:13px; color:var(--ink);
}
.obs .ask span{
  font-weight:700; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-right:8px;
}

footer.foot{
  margin-top:38px; padding-top:16px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
}

/* ── Print / board pack ────────────────────────────────────── */
@page{size:A4 landscape; margin:12mm}
@media print{
  html,body{background:#fff}
  .wrap{max-width:none; padding:0}
  .controls, #loading{display:none !important}
  .masthead, .card, .kpi, .obs article, .panel{
    box-shadow:none; border-color:#d6d5ce; break-inside:avoid; page-break-inside:avoid;
  }
  .section-head{break-after:avoid; page-break-after:avoid; margin-top:20px}
  .card, .obs article, .kpi{break-inside:avoid}
  .tablewrap{overflow:visible; border-color:#d6d5ce}
  thead th{position:static; background:#efeeea !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  tbody tr.best td, tbody tr.flagged td{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  table{font-size:9.5px}
  tbody td, thead th{padding:5px 6px}
  body{font-size:12px}
  #report.stale{opacity:1}
  /* the 17-column table must fit the page width, not scroll off it */
  #outlet-table{font-size:8px; table-layout:auto}
  #outlet-table td, #outlet-table th{padding:3px 4px}
  #outlet-table th{white-space:normal; letter-spacing:0; text-transform:none; font-size:8px}
  #outlet-table th .arrow{display:none}
  #outlet-table td.txt{white-space:normal}
  #outlet-table .swatch{width:6px; height:6px}
  .masthead{padding:16px 20px}
  .masthead h1{font-size:22px}
  .masthead .sub{font-size:14px}
  .masthead .meta{margin-top:9px; font-size:10.5px}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; margin-top:12px}
  .kpi{padding:10px 12px}
  .kpi .label{font-size:8.5px; letter-spacing:.05em}
  .kpi .value{font-size:17px}
  .kpi .value.small{font-size:15px}
  .kpi .sub, .kpi .breakdown{font-size:9px}
  /* shrink the plots so a card fits one landscape page instead of leaving a gap */
  .chartbox{height:230px !important}
  .chartbox.tall{height:290px !important}
  .section-head{margin:14px 0 8px}
  .section-head h2{font-size:15px}
  .section-head p{font-size:11px}
  .card{padding:12px 14px}
  .card h3{font-size:12.5px}
  .card .note{font-size:10.5px; margin-bottom:9px}
  .legend{font-size:10.5px; margin-bottom:8px}
  .obs article{padding:13px 16px}
  .obs h3{font-size:13px}
  .obs .body{font-size:11.5px}
  .obs .ask{font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 1 ── TITLE BLOCK ─────────────────────────────────────── -->
  <header class="masthead">
    <div class="identity">
      <p class="eyebrow" id="m-eyebrow">Board pack — management information</p>
      <h1 id="m-company">Nusa Kopi Group Sdn Bhd</h1>
      <p class="sub">Outlet contribution analysis</p>
      <div class="meta">
        <span>Financial year <b id="m-fy">—</b></span>
        <span>Currency <b id="m-ccy">—</b></span>
        <span>Source <b id="m-source">Outlet P&amp;L tab, live</b></span>
        <span>Outlets <b id="m-count">—</b></span>
      </div>
    </div>
    <div class="controls">
      <button id="refresh" type="button" aria-live="polite">
        <span class="spin" aria-hidden="true"></span><span class="txt">Refresh data</span>
      </button>
      <div class="stamp">Last updated <b id="m-updated">never</b></div>
    </div>
  </header>

  <div id="states"></div>
  <div id="loading">Contacting Google Sheets…</div>

  <main id="report" hidden></main>

  <footer class="foot">
    <span>Direct outlet economics before head office overhead, depreciation and finance costs.</span>
    <span id="foot-src">—</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   1. CONFIGURATION — change the sheet here and nowhere else
   ═══════════════════════════════════════════════════════════════════════════
   From a share link of the shape
     https://docs.google.com/spreadsheets/d/<SHEET_ID>/edit?gid=<TAB_GID>#gid=<TAB_GID>
   the long token between /d/ and /edit is SHEET_ID, and the number after
   gid= is TAB_GID (the numeric id of the "Outlet P&L" tab — the tab id shown
   in the URL while that tab is selected, NOT its position).
   ═════════════════════════════════════════════════════════════════════════ */

const SHEET_ID = "PASTE_SHEET_ID_HERE";   // e.g. "1AbC…xyz"  (between /d/ and /edit)
const TAB_GID  = "PASTE_TAB_GID_HERE";    // e.g. "1234567890" (the gid= number)
const TAB_NAME = "Outlet P&L";            // used only if TAB_GID is left unset

/* Presentation constants */
const COMPANY            = "Nusa Kopi Group Sdn Bhd";
const CURRENCY_CODE      = "RM";
const CURRENCY_LONG      = "Ringgit Malaysia (RM)";
const FY_LABEL_FALLBACK  = "Year ended 31 December 2025";
const LOCALE             = "en-MY";

/* Analytical thresholds */
const CONTRIBUTION_FLAG_PCT = 34.0;   // outlets below this are flagged red
const OCCUPANCY_FLAG_PCT    = 10.0;   // occupancy above this % of revenue is flagged
const CONCENTRATION_TOP_N   = 3;      // "top N" used in the concentration section

/* Header detection: the tab carries title rows above the real header, so the
   header row is located by content, never by position. */
const HEADER_ANCHOR_A = "outlet";
const HEADER_ANCHOR_B = "net revenue";

/* Column labels expected on the header row (matched case/space-insensitively,
   with a positional fallback if a label does not survive the round trip). */
const COLUMNS = [
  { key:"code",      label:"Code",               kind:"text",  pos:0  },
  { key:"outlet",    label:"Outlet",             kind:"text",  pos:1  },
  { key:"location",  label:"Location",           kind:"text",  pos:2  },
  { key:"format",    label:"Format",             kind:"text",  pos:3  },
  { key:"opened",    label:"Opened",             kind:"date",  pos:4  },
  { key:"sqft",      label:"Sq ft",              kind:"num",   pos:5  },
  { key:"seats",     label:"Seats",              kind:"num",   pos:6  },
  { key:"revenue",   label:"Net revenue",        kind:"money", pos:7  },
  { key:"cos",       label:"Cost of sales",      kind:"money", pos:8  },
  { key:"gp",        label:"Gross profit",       kind:"money", pos:9  },
  { key:"gpPct",     label:"GP %",               kind:"pct",   pos:10 },
  { key:"payroll",   label:"Outlet payroll",     kind:"money", pos:11 },
  { key:"occupancy", label:"Occupancy",          kind:"money", pos:12 },
  { key:"selling",   label:"Selling costs",      kind:"money", pos:13 },
  { key:"contrib",   label:"Outlet contribution",kind:"money", pos:14 },
  { key:"contribPct",label:"Contribution %",     kind:"pct",   pos:15 },
  { key:"revPsf",    label:"Revenue per sq ft",  kind:"money", pos:16 }
];

/* ═══════════════════════════════════════════════════════════════════════════
   2. FORMATTING
   ═══════════════════════════════════════════════════════════════════════════ */
const nf0 = new Intl.NumberFormat(LOCALE, { minimumFractionDigits:0, maximumFractionDigits:0 });
const nf1 = new Intl.NumberFormat(LOCALE, { minimumFractionDigits:1, maximumFractionDigits:1 });
const nf2 = new Intl.NumberFormat(LOCALE, { minimumFractionDigits:2, maximumFractionDigits:2 });

const money  = n => (n == null || !isFinite(n)) ? "—" : CURRENCY_CODE + " " + nf0.format(Math.round(n));
const money2 = n => (n == null || !isFinite(n)) ? "—" : CURRENCY_CODE + " " + nf2.format(n);
const pct1   = n => (n == null || !isFinite(n)) ? "—" : nf1.format(n) + "%";
const int0   = n => (n == null || !isFinite(n)) ? "—" : nf0.format(n);
const moneyK = n => (n == null || !isFinite(n)) ? "—"
                  : Math.abs(n) >= 1e6 ? CURRENCY_CODE + " " + nf2.format(n/1e6) + "m"
                  : CURRENCY_CODE + " " + nf0.format(Math.round(n));
const dateLong = d => !(d instanceof Date) || isNaN(d) ? "—"
  : d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
const dateShort = d => !(d instanceof Date) || isNaN(d) ? "—"
  : d.toLocaleDateString("en-GB", { month:"short", year:"numeric" });
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ═══════════════════════════════════════════════════════════════════════════
   3. TRANSPORT — JSONP against the gviz endpoint
      A script tag, not fetch: no API key, no server, no Google Cloud project.
      Works on any sheet shared "anyone with the link can view".
   ═══════════════════════════════════════════════════════════════════════════ */
const GVIZ_TIMEOUT_MS = 20000;
let jsonpSeq = 0;

function isConfigured() {
  return SHEET_ID && !/^PASTE_/.test(SHEET_ID);
}

/* Optional override so the file can be pointed at a sheet without editing it:
   dashboard.html?sheet=<full share link or bare id>&gid=<gid> */
function resolveTarget() {
  const q = new URLSearchParams(location.search);
  let id = SHEET_ID, gid = TAB_GID;
  const s = q.get("sheet");
  if (s) {
    const m = s.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    id = m ? m[1] : s.trim();
    const g = s.match(/[?#&]gid=([0-9]+)/);
    if (g) gid = g[1];
  }
  if (q.get("gid")) gid = q.get("gid");
  const gidClean = (gid && !/^PASTE_/.test(gid)) ? String(gid).trim() : "";
  return { id: (id || "").trim(), gid: gidClean, configured: !!id && !/^PASTE_/.test(id) };
}

function buildUrl(target, callbackName) {
  const base = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(target.id) + "/gviz/tq";
  const p = new URLSearchParams();
  // headers=0 => gviz returns every physical row as data, so the four title
  // rows arrive intact and we can locate the real header ourselves.
  p.set("headers", "0");
  p.set("tqx", "out:json;responseHandler:" + callbackName);
  if (target.gid) p.set("gid", target.gid);
  else p.set("sheet", TAB_NAME);
  p.set("_cb", String(Date.now()));   // defeat the browser cache on Refresh
  return base + "?" + p.toString();
}

function loadSheet(target) {
  return new Promise((resolve, reject) => {
    const cb = "__nusaKopiGviz" + (++jsonpSeq);
    const script = document.createElement("script");
    let done = false;

    const cleanup = () => {
      clearTimeout(timer);
      delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(() => {
      if (done) return;
      done = true; cleanup();
      reject(new GvizError("timeout",
        "Google did not answer within " + (GVIZ_TIMEOUT_MS/1000) + " seconds."));
    }, GVIZ_TIMEOUT_MS);

    window[cb] = payload => {
      if (done) return;
      done = true; cleanup();
      resolve(payload);
    };
    script.onerror = () => {
      if (done) return;
      done = true; cleanup();
      // A blocked script tag is indistinguishable from a 404 by design, and by
      // far the most common cause is sharing, so say so.
      reject(new GvizError("network",
        "The browser could not load the sheet. Google returns an error page " +
        "(not data) when the file is not shared publicly, when the sheet id is " +
        "wrong, or when the tab id does not exist."));
    };

    script.src = buildUrl(target, cb);
    script.async = true;
    document.head.appendChild(script);
  });
}

class GvizError extends Error {
  constructor(kind, message, detail) { super(message); this.kind = kind; this.detail = detail || ""; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   4. PARSING — the tab has four title rows above the real header
   ═══════════════════════════════════════════════════════════════════════════ */

/* gviz encodes dates as the string "Date(y,m,d)"; the month is 0-based. */
function toDate(v) {
  if (v instanceof Date) return v;
  if (typeof v === "string") {
    const m = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
    if (m) return new Date(+m[1], +m[2], +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    const iso = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);
    const d = new Date(v);
    if (!isNaN(d)) return d;
  }
  return null;
}

/* Read a cell as display text, whichever way gviz typed the column. */
function cellText(c) {
  if (c == null) return "";
  if (c.f != null && String(c.f).trim() !== "") return String(c.f).trim();
  if (c.v == null) return "";
  if (c.v instanceof Date) return c.v.toISOString().slice(0,10);
  if (typeof c.v === "string" && /^Date\(/.test(c.v)) {
    const d = toDate(c.v);
    return d ? d.toISOString().slice(0,10) : c.v;
  }
  return String(c.v).trim();
}

/* Read a cell as a number, tolerating "RM 1,234.50", "35.1%" and "(123)". */
function cellNum(c) {
  if (c == null) return null;
  if (typeof c.v === "number") return c.v;
  const raw = (c.v != null ? c.v : c.f);
  if (raw == null) return null;
  let s = String(raw).trim();
  if (s === "" || s === "-" || s === "—") return null;
  const neg = /^\(.*\)$/.test(s);
  const isPct = /%\s*$/.test(s);
  s = s.replace(/[()]/g, "").replace(/[^0-9.\-]/g, "");
  if (s === "" || s === "-" || s === ".") return null;
  let n = parseFloat(s);
  if (!isFinite(n)) return null;
  if (isPct) n = n / 100;
  return neg ? -Math.abs(n) : n;
}

/* Percent columns arrive as a fraction (0.351) when the cell is percent-
   formatted, or as 35.1 when it is a plain number. Normalise to 0–100. */
function asPct(c) {
  const n = cellNum(c);
  if (n == null) return null;
  return Math.abs(n) <= 1.5 ? n * 100 : n;
}

const norm = s => String(s == null ? "" : s).toLowerCase().replace(/[\s ]+/g, " ").trim();

function parseTable(payload) {
  if (!payload) throw new GvizError("empty", "Google returned an empty response.");
  if (payload.status === "error") {
    const e = (payload.errors && payload.errors[0]) || {};
    const reason = e.reason || "";
    if (/access_denied|user_not_authenticated/i.test(reason)) {
      throw new GvizError("sharing",
        "Google refused the request because the sheet is not readable without signing in.",
        [e.message, e.detailed_message].filter(Boolean).join(" — "));
    }
    if (/invalid_query|not_found|bad_request/i.test(reason)) {
      throw new GvizError("target",
        "Google accepted the request but could not find that sheet or tab.",
        [e.message, e.detailed_message].filter(Boolean).join(" — "));
    }
    throw new GvizError("gviz", "Google returned an error.",
      [reason, e.message, e.detailed_message].filter(Boolean).join(" — "));
  }
  const table = payload.table;
  if (!table || !Array.isArray(table.rows) || table.rows.length === 0) {
    throw new GvizError("empty", "The tab came back with no rows in it.");
  }

  const grid = table.rows.map(r => (r && r.c) ? r.c : []);
  const width = Math.max(table.cols ? table.cols.length : 0,
                         ...grid.map(r => r.length));

  /* ── Locate the header row by content ── */
  const texts = grid.map(r => {
    const out = [];
    for (let i = 0; i < width; i++) out.push(norm(cellText(r[i])));
    return out;
  });

  let headerIdx = texts.findIndex(row =>
    row.includes(HEADER_ANCHOR_A) && row.includes(HEADER_ANCHOR_B));

  const numericRun = i => {
    const next = grid[i+1];
    if (!next) return 0;
    let nums = 0;
    for (let j = 0; j < width; j++) if (typeof cellNum(next[j]) === "number") nums++;
    return nums;
  };

  if (headerIdx < 0) {
    // Fallback: gviz types a mixed column as a number and drops the label text
    // in it, so "Net revenue" can go missing. Accept "Outlet" plus either
    // several other known labels or a row of numbers directly beneath.
    const wanted = COLUMNS.map(c => norm(c.label));
    headerIdx = texts.findIndex((row, i) => {
      if (!row.includes(HEADER_ANCHOR_A)) return false;
      return row.filter(v => v && wanted.includes(v)).length >= 3 || numericRun(i) >= 6;
    });
  }
  if (headerIdx < 0) {
    // Last resort: a run of text labels immediately above a run of numbers.
    headerIdx = texts.findIndex((row, i) =>
      row.filter(Boolean).length >= 3 && numericRun(i) >= 6);
  }
  if (headerIdx < 0) {
    const preview = texts.slice(0, 8).map((r,i) => "row " + (i+1) + ": " + r.filter(Boolean).slice(0,6).join(" | "));
    throw new GvizError("header",
      'Could not find the header row. It is identified by a row containing both "' +
      HEADER_ANCHOR_A + '" and "' + HEADER_ANCHOR_B + '".',
      preview.join("\n"));
  }

  /* ── Map every wanted column onto a physical column index ── */
  const headerTexts = texts[headerIdx];
  const used = new Set();
  const idx = {};
  COLUMNS.forEach(col => {
    const want = norm(col.label);
    let at = headerTexts.findIndex((h, i) => h === want && !used.has(i));
    if (at < 0) at = headerTexts.findIndex((h, i) => h && !used.has(i) &&
      (h.startsWith(want) || want.startsWith(h)));
    if (at < 0 && col.pos < width && !used.has(col.pos) && !headerTexts[col.pos]) at = col.pos;
    if (at >= 0) { idx[col.key] = at; used.add(at); }
    else idx[col.key] = -1;
  });
  if (idx.code < 0 && idx.outlet >= 0) idx.code = Math.max(0, idx.outlet - 1);

  const at = (row, key) => idx[key] >= 0 ? row[idx[key]] : null;

  /* ── Read the outlet rows, stopping short of the total and the
        reconciliation block below it (both have no outlet code) ── */
  const outlets = [];
  for (let r = headerIdx + 1; r < grid.length; r++) {
    const row = grid[r];
    if (!row || row.length === 0) continue;
    const code = cellText(at(row, "code"));
    const name = cellText(at(row, "outlet"));
    const revenue = cellNum(at(row, "revenue"));
    if (!code) continue;                                   // total + reconciliation
    if (/^total\b/i.test(code) || /^total\b/i.test(name)) continue;
    if (revenue == null || !(revenue > 0)) continue;

    const o = {
      code, outlet: name,
      location: cellText(at(row, "location")),
      format:   cellText(at(row, "format")) || "Unclassified",
      opened:   toDate(at(row,"opened") ? (at(row,"opened").v != null ? at(row,"opened").v : at(row,"opened").f) : null),
      sqft:      cellNum(at(row, "sqft")),
      seats:     cellNum(at(row, "seats")),
      revenue,
      cos:       cellNum(at(row, "cos")),
      gp:        cellNum(at(row, "gp")),
      gpPct:     asPct(at(row, "gpPct")),
      payroll:   cellNum(at(row, "payroll")),
      occupancy: cellNum(at(row, "occupancy")),
      selling:   cellNum(at(row, "selling")),
      contrib:   cellNum(at(row, "contrib")),
      contribPct:asPct(at(row, "contribPct")),
      revPsf:    cellNum(at(row, "revPsf"))
    };

    // Derive anything the tab did not carry, and always derive the
    // cost ratios, which are needed as a % of each outlet's own revenue.
    if (o.gp == null && o.cos != null) o.gp = o.revenue - o.cos;
    if (o.contrib == null) o.contrib = (o.gp || 0) - (o.payroll || 0) - (o.occupancy || 0) - (o.selling || 0);
    if (o.gpPct == null && o.gp != null) o.gpPct = o.gp / o.revenue * 100;
    if (o.contribPct == null) o.contribPct = o.contrib / o.revenue * 100;
    if (o.revPsf == null && o.sqft) o.revPsf = o.revenue / o.sqft;

    o.cosPct     = o.cos       != null ? o.cos / o.revenue * 100 : null;
    o.payrollPct = o.payroll   != null ? o.payroll / o.revenue * 100 : null;
    o.occPct     = o.occupancy != null ? o.occupancy / o.revenue * 100 : null;
    o.sellingPct = o.selling   != null ? o.selling / o.revenue * 100 : null;
    o.revPseat   = o.seats ? o.revenue / o.seats : null;

    outlets.push(o);
  }

  if (outlets.length === 0) {
    throw new GvizError("empty",
      "The header row was found on row " + (headerIdx + 1) +
      ", but no outlet rows with a code and a positive net revenue followed it.");
  }

  /* Financial year label, taken from the title rows if it is stated there. */
  let fy = "";
  for (let r = 0; r < headerIdx; r++) {
    // read the raw text, not the lowercased copy used for matching
    const line = (grid[r] || []).map(cellText).filter(Boolean).join(" ");
    const m = line.match(/(year ended[^—|]*)/i) || line.match(/\b(fy\s?20\d\d)\b/i);
    if (m) { fy = m[1].trim().replace(/^\w/, ch => ch.toUpperCase()); break; }
  }

  return { outlets, headerRow: headerIdx + 1, fy: fy || FY_LABEL_FALLBACK };
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   5. ANALYTICS
   ═══════════════════════════════════════════════════════════════════════════ */
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const mean = (a, f) => a.length ? sum(a, f) / a.length : null;
const byDesc = f => (x, y) => (f(y) ?? -Infinity) - (f(x) ?? -Infinity);
const FORMAT_ORDER = ["Flagship", "Standard", "Kiosk"];
const FORMAT_COLOR = { Flagship:"#2a78d6", Standard:"#eb6834", Kiosk:"#1baf7a" };
const FALLBACK_COLOR = "#4a3aa7";
const fmtColor = f => FORMAT_COLOR[f] || FALLBACK_COLOR;
const fmtSlug  = f => String(f || "").toLowerCase().replace(/[^a-z0-9]+/g, "-");

function analyse(data) {
  const o = data.outlets;
  const revenue   = sum(o, x => x.revenue);
  const contrib   = sum(o, x => x.contrib);
  const sqft      = sum(o, x => x.sqft);
  const seats     = sum(o, x => x.seats);
  const cos       = sum(o, x => x.cos);
  const payroll   = sum(o, x => x.payroll);
  const occupancy = sum(o, x => x.occupancy);
  const selling   = sum(o, x => x.selling);

  const formats = [];
  const seen = new Map();
  o.forEach(x => {
    if (!seen.has(x.format)) seen.set(x.format, []);
    seen.get(x.format).push(x);
  });
  const order = [...FORMAT_ORDER.filter(f => seen.has(f)),
                 ...[...seen.keys()].filter(f => !FORMAT_ORDER.includes(f))];
  order.forEach(name => {
    const rs = seen.get(name);
    const r = sum(rs, x => x.revenue), c = sum(rs, x => x.contrib);
    const s = sum(rs, x => x.sqft), t = sum(rs, x => x.seats);
    formats.push({
      name, count: rs.length, outlets: rs,
      revenue: r, contrib: c, sqft: s, seats: t,
      avgContribPct: mean(rs, x => x.contribPct),
      wtdContribPct: r ? c / r * 100 : null,
      revPsf:  s ? r / s : null,
      revPseat: t ? r / t : null,
      occPct:  r ? sum(rs, x => x.occupancy) / r * 100 : null,
      sellingPct: r ? sum(rs, x => x.selling) / r * 100 : null,
      payrollPct: r ? sum(rs, x => x.payroll) / r * 100 : null,
      cosPct: r ? sum(rs, x => x.cos) / r * 100 : null,
      revShare: revenue ? r / revenue * 100 : null
    });
  });

  const byContrib = [...o].sort(byDesc(x => x.contribPct));
  const byRevenue = [...o].sort(byDesc(x => x.revenue));
  const byContribAbs = [...o].sort(byDesc(x => x.contrib));
  const byPsf = [...o].sort(byDesc(x => x.revPsf));

  const n = Math.min(CONCENTRATION_TOP_N, o.length);
  const topRev = byRevenue.slice(0, n);
  const topCon = byContribAbs.slice(0, n);

  return {
    outlets: o, headerRow: data.headerRow, fy: data.fy,
    count: o.length,
    revenue, contrib, sqft, seats, cos, payroll, occupancy, selling,
    contribPct: revenue ? contrib / revenue * 100 : null,
    avgContribPct: mean(o, x => x.contribPct),
    revPsf:  sqft ? revenue / sqft : null,
    revPseat: seats ? revenue / seats : null,
    cosPct: revenue ? cos / revenue * 100 : null,
    payrollPct: revenue ? payroll / revenue * 100 : null,
    occPct: revenue ? occupancy / revenue * 100 : null,
    sellingPct: revenue ? selling / revenue * 100 : null,
    formats,
    byContrib, byRevenue, byContribAbs, byPsf,
    best: byContrib[0],
    worst: byContrib[byContrib.length - 1],
    flagged: o.filter(x => x.contribPct != null && x.contribPct < CONTRIBUTION_FLAG_PCT),
    occFlagged: o.filter(x => x.occPct != null && x.occPct > OCCUPANCY_FLAG_PCT),
    conc: {
      n,
      codes: topRev.map(x => x.code),
      contribCodes: topCon.map(x => x.code),
      revShare: revenue ? sum(topRev, x => x.revenue) / revenue * 100 : null,
      conShare: contrib ? sum(topCon, x => x.contrib) / contrib * 100 : null,
      revAmount: sum(topRev, x => x.revenue),
      conAmount: sum(topCon, x => x.contrib)
    }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   6. CHART PLUMBING
   ═══════════════════════════════════════════════════════════════════════════ */
const CHARTS = new Map();
function mountChart(id, config) {
  const prev = CHARTS.get(id);
  if (prev) { prev.destroy(); CHARTS.delete(id); }   // never stack canvases
  const el = document.getElementById(id);
  if (!el) return null;
  const c = new Chart(el.getContext("2d"), config);
  CHARTS.set(id, c);
  return c;
}
function destroyAllCharts() {
  CHARTS.forEach(c => c.destroy());
  CHARTS.clear();
}

const INK = "#0b0b0b", INK2 = "#52514e", MUTED = "#898781";
const GRID = "#ebeae4", AXIS = "#c3c2b7", SURFACE = "#ffffff";
const CRITICAL = "#d03b3b", NEUTRAL = "#c9c8c1";

Chart.defaults.font.family = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
Chart.defaults.font.size = 11.5;
Chart.defaults.color = INK2;
Chart.defaults.devicePixelRatio = Math.max(2, window.devicePixelRatio || 1);
Chart.defaults.animation = { duration: 320 };
Chart.defaults.maintainAspectRatio = false;

const TOOLTIP = {
  backgroundColor:"#101010", titleColor:"#ffffff", bodyColor:"#e8e8e4",
  borderColor:"rgba(255,255,255,.14)", borderWidth:1,
  padding:{ top:9, right:12, bottom:9, left:12 }, cornerRadius:6,
  displayColors:true, boxWidth:9, boxHeight:9, boxPadding:5,
  titleFont:{ size:12, weight:"600" }, bodyFont:{ size:12 }
};

/* Reference line: options.plugins.refLine = {value, axis:'x'|'y', label} */
const refLinePlugin = {
  id: "refLine",
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts) return;
    const lines = Array.isArray(opts.lines) ? opts.lines : [opts];
    lines.forEach(o => drawRef(chart, o));
  }
};
function drawRef(chart, opts) {
    if (!opts || opts.value == null || !isFinite(opts.value)) return;
    const { ctx, chartArea:a, scales } = chart;
    const axis = opts.axis === "y" ? "y" : "x";
    const scale = scales[axis];
    if (!scale) return;
    const p = scale.getPixelForValue(opts.value);
    if (!isFinite(p)) return;
    ctx.save();
    ctx.strokeStyle = opts.color || "#6f6e69";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (axis === "x") { ctx.moveTo(p, a.top); ctx.lineTo(p, a.bottom); }
    else              { ctx.moveTo(a.left, p); ctx.lineTo(a.right, p); }
    ctx.stroke();
    if (opts.label) {
      ctx.font = '600 10.5px system-ui, -apple-system, "Segoe UI", sans-serif';
      const w = ctx.measureText(opts.label).width;
      let x, y;
      if (axis === "x") {
        x = Math.min(Math.max(p - w/2 - 6, a.left), a.right - w - 12);
        y = a.top - 2;
      } else {
        x = a.right - w - 12; y = p - 15;
      }
      ctx.fillStyle = SURFACE;
      ctx.fillRect(x, y - 10, w + 12, 16);
      ctx.fillStyle = opts.color || "#6f6e69";
      ctx.fillText(opts.label, x + 6, y + 2);
    }
    ctx.restore();
}

/* Direct labels at the end of horizontal bars */
const barEndLabels = {
  id: "barEndLabels",
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || !opts.text) return;
    const meta = chart.getDatasetMeta(opts.dataset || 0);
    if (!meta || meta.hidden) return;
    const { ctx, chartArea:a } = chart;
    ctx.save();
    ctx.font = '600 10.5px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textBaseline = "middle";
    meta.data.forEach((bar, i) => {
      const t = opts.text(i);
      if (!t) return;
      const w = ctx.measureText(t).width;
      const base = bar.base != null ? bar.base : a.left;
      const negative = bar.x < base;
      const fits = Math.abs(bar.x - base) > w + 18;   // only label inside when it fits
      ctx.textAlign = fits ? (negative ? "left" : "right") : (negative ? "right" : "left");
      ctx.fillStyle = fits ? "#ffffff" : INK2;
      const dx = fits ? (negative ? 9 : -9) : (negative ? -8 : 8);
      ctx.fillText(t, bar.x + dx, bar.y);
    });
    ctx.restore();
  }
};

/* Point labels for scatter plots */
const pointLabels = {
  id: "pointLabels",
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || !opts.enabled) return;
    const { ctx, chartArea:a } = chart;
    ctx.save();
    ctx.font = '600 10px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textBaseline = "middle";
    const placed = [];
    chart.data.datasets.forEach((ds, di) => {
      const meta = chart.getDatasetMeta(di);
      if (meta.hidden) return;
      meta.data.forEach((pt, i) => {
        const label = ds.data[i] && ds.data[i].label;
        if (!label) return;
        const w = ctx.measureText(label).width;
        // try right, then left, then above, then below
        const spots = [
          { x: pt.x + 9,     y: pt.y,      align:"left"  },
          { x: pt.x - 9,     y: pt.y,      align:"right" },
          { x: pt.x,         y: pt.y - 13, align:"center"},
          { x: pt.x,         y: pt.y + 13, align:"center"}
        ];
        let chosen = null;
        for (const s of spots) {
          const x0 = s.align === "left" ? s.x : s.align === "right" ? s.x - w : s.x - w/2;
          const box = { x0, x1: x0 + w, y0: s.y - 6, y1: s.y + 6 };
          if (box.x0 < a.left + 2 || box.x1 > a.right - 2) continue;
          if (box.y0 < a.top + 2 || box.y1 > a.bottom - 2) continue;
          if (placed.some(p => !(box.x1 < p.x0 - 2 || box.x0 > p.x1 + 2 ||
                                 box.y1 < p.y0 - 2 || box.y0 > p.y1 + 2))) continue;
          chosen = { s, box }; break;
        }
        if (!chosen) return;
        placed.push(chosen.box);
        ctx.textAlign = chosen.s.align;
        ctx.fillStyle = SURFACE;   // 2px surface halo keeps the code legible
        ctx.lineWidth = 3; ctx.strokeStyle = SURFACE;
        ctx.strokeText(label, chosen.s.x, chosen.s.y);
        ctx.fillStyle = INK;
        ctx.fillText(label, chosen.s.x, chosen.s.y);
      });
    });
    ctx.restore();
  }
};

Chart.register(refLinePlugin, barEndLabels, pointLabels);

const gridX = { grid:{ color:GRID, drawTicks:false }, border:{ color:AXIS, display:true },
                ticks:{ color:MUTED, padding:6 } };
const catY  = { grid:{ display:false }, border:{ color:AXIS },
                ticks:{ color:INK2, font:{ size:11.5, weight:"500" }, padding:6 } };
