<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   7. LAYOUT
   ═══════════════════════════════════════════════════════════════════════════ */
function sectionHead(n, title, note) {
  return '<div class="section-head"><span class="n">' + n + '</span>' +
         '<h2>' + esc(title) + '</h2>' +
         (note ? '<p>' + note + '</p>' : '') + '</div>';
}
function formatLegend(a) {
  return '<div class="legend">' + a.formats.map(f =>
    '<span><i class="swatch" style="background:' + fmtColor(f.name) + '"></i>' +
    esc(f.name) + ' (' + f.count + ')</span>').join("") + '</div>';
}

function buildReport(a) {
  const rowH = 26, chartH = n => Math.max(240, n * rowH + 66);

  return [

  /* ── 2. PORTFOLIO KPIs ───────────────────────────────────── */
  '<div class="kpis">',
    kpi("Total net revenue", money(a.revenue),
        int0(a.count) + " trading outlets"),
    kpi("Total outlet contribution", money(a.contrib),
        "Before head office, depreciation and finance costs"),
    kpi("Average contribution %", pct1(a.contribPct),
        "Revenue-weighted · simple mean " + pct1(a.avgContribPct)),
    kpi("Revenue per sq ft", money(a.revPsf),
        int0(a.sqft) + " sq ft across the estate"),
    '<div class="kpi"><span class="label">Outlets by format</span>' +
      '<span class="value">' + int0(a.count) + '</span>' +
      '<span class="breakdown">' + a.formats.map(f =>
        '<span><i class="swatch sw-' + fmtSlug(f.name) + '" style="background:' +
        fmtColor(f.name) + '"></i>' + int0(f.count) + ' ' + esc(f.name) + '</span>').join("") +
      '</span></div>',
  '</div>',

  /* ── 3. CONTRIBUTION RANKING ─────────────────────────────── */
  sectionHead("03", "Contribution ranking",
    "Every outlet by contribution as a percentage of its own net revenue, best to worst. " +
    "The rule marks the portfolio average of <b>" + pct1(a.contribPct) + "</b>."),
  '<div class="card">',
    formatLegend(a),
    '<div class="chartbox tall" style="height:' + chartH(a.count) + 'px"><canvas id="c-rank"></canvas></div>',
    a.flagged.length
      ? '<p class="note" style="margin:12px 0 0">⚠ ' + a.flagged.length + ' outlet' +
        (a.flagged.length > 1 ? "s" : "") + ' below the ' + pct1(CONTRIBUTION_FLAG_PCT) +
        ' board threshold: ' + a.flagged.map(o => esc(o.code)).join(", ") + '.</p>'
      : '<p class="note" style="margin:12px 0 0">No outlet falls below the ' +
        pct1(CONTRIBUTION_FLAG_PCT) + ' board threshold. The spread from best to worst is ' +
        pct1(a.best.contribPct - a.worst.contribPct) + ' points.</p>',
  '</div>',
  '<div class="card" style="margin-top:18px">',
    '<h3>Variance from the portfolio average</h3>' +
      '<p class="note">The same ranking on an expanded scale, in basis points either side of ' +
      pct1(a.contribPct) + '. The bars above are drawn from zero and are therefore ' +
      'almost indistinguishable &mdash; which is itself the finding.</p>',
    '<div class="chartbox tall" style="height:' + chartH(a.count) + 'px"><canvas id="c-rank-var"></canvas></div>',
  '</div>',

  /* ── 4 & 7. PRODUCTIVITY + OCCUPANCY ─────────────────────── */
  sectionHead("04", "Space productivity and occupancy burden",
    "Whether the space earns its rent, and what the rent costs as a share of what the space earns."),
  '<div class="grid g2">',
    '<div class="card"><h3>Revenue per sq ft</h3>' +
      '<p class="note">Sorted. Estate average ' + money(a.revPsf) + ' per sq ft.</p>' +
      '<div class="chartbox" style="height:320px"><canvas id="c-psf"></canvas></div></div>',
    '<div class="card"><h3>Occupancy cost as a % of revenue</h3>' +
      '<p class="note">Flagged above ' + pct1(OCCUPANCY_FLAG_PCT) +
      ', the level at which rent starts dictating the P&amp;L.</p>' +
      '<div class="chartbox" style="height:320px"><canvas id="c-occ"></canvas></div>' +
      (a.occFlagged.length
        ? '<p class="note" style="margin:12px 0 0"><span class="pill bad">⚠ ' +
          a.occFlagged.length + ' above ' + pct1(OCCUPANCY_FLAG_PCT) + '</span> ' +
          a.occFlagged.map(o => esc(o.code) + " " + pct1(o.occPct)).join(", ") + '</p>'
        : '<p class="note" style="margin:12px 0 0"><span class="pill ok">✓ none above ' +
          pct1(OCCUPANCY_FLAG_PCT) + '</span> Range ' +
          pct1(Math.min(...a.outlets.map(o => o.occPct))) + ' to ' +
          pct1(Math.max(...a.outlets.map(o => o.occPct))) + ' of revenue.</p>') +
    '</div>',
  '</div>',

  /* ── 5. PRODUCTIVITY VS PROFITABILITY ────────────────────── */
  sectionHead("05", "Productivity against profitability",
    "Revenue per sq ft on the horizontal, contribution % on the vertical. " +
    "Busy but unprofitable sits bottom-right; small but efficient sits top-left."),
  '<div class="card">',
    formatLegend(a),
    '<div class="chartbox" style="height:440px"><canvas id="c-scatter"></canvas></div>',
    '<p class="note" style="margin:14px 0 0">Quadrants split on the estate average, ' +
      money(a.revPsf) + ' per sq ft and ' + pct1(a.contribPct) + ' contribution.</p>',
  '</div>',

  /* ── 6. COST STRUCTURE ───────────────────────────────────── */
  sectionHead("06", "Cost structure by outlet",
    "Each cost line as a percentage of that outlet's own revenue, so it is clear " +
    "<i>where</i> margin is lost, not only that it was lost. Sorted by contribution, best at the top."),
  '<div class="card">',
    '<div class="legend">' +
      '<span><i class="swatch" style="background:var(--cost-1)"></i>Cost of sales</span>' +
      '<span><i class="swatch" style="background:var(--cost-2)"></i>Outlet payroll</span>' +
      '<span><i class="swatch" style="background:var(--cost-3)"></i>Occupancy</span>' +
      '<span><i class="swatch" style="background:var(--cost-4)"></i>Selling costs</span>' +
      '<span><i class="swatch" style="background:var(--neutral-mark)"></i>Outlet contribution</span>' +
    '</div>',
    '<div class="chartbox tall" style="height:' + chartH(a.count) + 'px"><canvas id="c-cost"></canvas></div>',
    '<p class="note" style="margin:14px 0 0">Portfolio: cost of sales ' + pct1(a.cosPct) +
      ', payroll ' + pct1(a.payrollPct) + ', occupancy ' + pct1(a.occPct) +
      ', selling ' + pct1(a.sellingPct) + ', contribution ' + pct1(a.contribPct) + '.</p>',
  '</div>',

  /* ── 8. FORMAT COMPARISON ────────────────────────────────── */
  sectionHead("08", "Format comparison",
    "Flagship against Standard against Kiosk. Three measures of different scale, " +
    "so three charts rather than one crowded axis."),
  '<div class="grid g3">',
    '<div class="card"><h3>Average contribution %</h3><p class="note">Mean across the outlets in each format.</p>' +
      '<div class="chartbox" style="height:230px"><canvas id="c-fmt-contrib"></canvas></div></div>',
    '<div class="card"><h3>Revenue per sq ft</h3><p class="note">Format revenue over format floor area.</p>' +
      '<div class="chartbox" style="height:230px"><canvas id="c-fmt-psf"></canvas></div></div>',
    '<div class="card"><h3>Revenue per seat</h3><p class="note">Format revenue over format seat count.</p>' +
      '<div class="chartbox" style="height:230px"><canvas id="c-fmt-seat"></canvas></div></div>',
  '</div>',
  '<div class="card" style="margin-top:18px"><div class="tablewrap" style="border:none">' +
    '<table class="simple-table"><thead><tr>' +
      '<th class="txt">Format</th><th>Outlets</th><th>Net revenue</th><th>Share of revenue</th>' +
      '<th>Avg contribution %</th><th>Revenue / sq ft</th><th>Revenue / seat</th>' +
      '<th>Occupancy % of rev.</th><th>Selling % of rev.</th>' +
    '</tr></thead><tbody>' +
    a.formats.map(f => '<tr>' +
      '<td class="txt"><span class="code-cell"><i class="swatch" style="background:' + fmtColor(f.name) + '"></i>' +
        esc(f.name) + '</span></td>' +
      '<td>' + int0(f.count) + '</td>' +
      '<td>' + money(f.revenue) + '</td>' +
      '<td>' + pct1(f.revShare) + '</td>' +
      '<td>' + pct1(f.avgContribPct) + '</td>' +
      '<td>' + money(f.revPsf) + '</td>' +
      '<td>' + money(f.revPseat) + '</td>' +
      '<td>' + pct1(f.occPct) + '</td>' +
      '<td>' + pct1(f.sellingPct) + '</td>' +
    '</tr>').join("") +
    '</tbody></table></div></div>',

  /* ── 9. MATURITY ─────────────────────────────────────────── */
  sectionHead("09", "Maturity",
    "Contribution % against opening date. A downward drift to the right would say the " +
    "newer outlets are still ramping."),
  '<div class="card">',
    formatLegend(a),
    '<div class="chartbox" style="height:360px"><canvas id="c-maturity"></canvas></div>',
  '</div>',

  /* ── 10. CONCENTRATION RISK ──────────────────────────────── */
  sectionHead("10", "Concentration risk",
    "How much of the estate rests on its largest " + a.conc.n + " outlets."),
  '<div class="grid g2">',
    '<div class="card">' + concRow(
        "Share of net revenue from the top " + a.conc.n,
        a.conc.revShare, a.conc.codes, money(a.conc.revAmount), money(a.revenue)) +
      concRow(
        "Share of outlet contribution from the top " + a.conc.n,
        a.conc.conShare, a.conc.contribCodes, money(a.conc.conAmount), money(a.contrib)) +
    '</div>',
    '<div class="card"><h3>Read-across</h3>' +
      '<p class="note">' + concNarrative(a) + '</p>' +
      '<div class="tablewrap" style="border:none"><table class="simple-table"><thead><tr>' +
        '<th class="txt">Outlet</th><th>Revenue</th><th>% est.</th>' +
        '<th>Contribution</th><th>% est.</th></tr></thead><tbody>' +
      a.byRevenue.slice(0, a.conc.n).map(o => '<tr>' +
        '<td class="txt wrap"><span class="code-cell"><i class="swatch" style="background:' + fmtColor(o.format) + '"></i>' +
          '<b>' + esc(o.code) + '</b> ' + esc(o.outlet) + '</span></td>' +
        '<td>' + money(o.revenue) + '</td>' +
        '<td>' + pct1(o.revenue / a.revenue * 100) + '</td>' +
        '<td>' + money(o.contrib) + '</td>' +
        '<td>' + pct1(o.contrib / a.contrib * 100) + '</td>' +
      '</tr>').join("") +
      '</tbody></table></div></div>',
  '</div>',

  /* ── 11. FULL OUTLET TABLE ───────────────────────────────── */
  sectionHead("11", "Full outlet table",
    "Every column from the tab, scrolling sideways on a narrow screen. Click a column heading to sort. " +
    "Outlets below " + pct1(CONTRIBUTION_FLAG_PCT) + " contribution are flagged red; " +
    "the strongest performer is highlighted."),
  '<div class="card"><div class="tablewrap"><table id="outlet-table">' +
    '<thead><tr id="outlet-head"></tr></thead><tbody id="outlet-body"></tbody></table></div>' +
    '<p class="note" style="margin:14px 0 0">' +
      '<span class="pill ok">★ strongest</span> ' + esc(a.best.code) + ' at ' + pct1(a.best.contribPct) +
      ' &nbsp; ' +
      (a.flagged.length
        ? '<span class="pill bad">⚠ below ' + pct1(CONTRIBUTION_FLAG_PCT) + '</span> ' +
          a.flagged.map(o => esc(o.code)).join(", ")
        : '<span class="pill ok">✓ none below ' + pct1(CONTRIBUTION_FLAG_PCT) + '</span> ' +
          'weakest is ' + esc(a.worst.code) + ' at ' + pct1(a.worst.contribPct)) +
    '</p></div>',

  /* ── 12. CFO OBSERVATIONS ────────────────────────────────── */
  sectionHead("12", "CFO observations",
    "Findings drawn only from the Outlet P&amp;L tab, with the figures that evidence them " +
    "and the question each puts to management."),
  '<div class="obs">' + observations(a).map((o, i) =>
    '<article class="sev-' + o.sev + '">' +
      '<p class="kicker">Observation ' + (i + 1) + '</p>' +
      '<h3>' + o.title + '</h3>' +
      '<p class="body">' + o.body + '</p>' +
      '<p class="ask"><span>Question to management</span>' + o.ask + '</p>' +
    '</article>').join("") + '</div>'

  ].join("");
}

function kpi(label, value, sub, small) {
  return '<div class="kpi"><span class="label">' + esc(label) + '</span>' +
         '<span class="value' + (small ? " small" : "") + ' num">' + esc(value) + '</span>' +
         '<span class="sub">' + sub + '</span></div>';
}

function concRow(title, share, codes, amount, total) {
  const s = Math.max(0, Math.min(100, share || 0));
  return '<div class="conc-row">' +
    '<div class="conc-head"><span class="t">' + esc(title) + '</span>' +
      '<span class="v">' + pct1(share) + '</span></div>' +
    '<div class="conc-bar">' +
      '<i class="top" style="width:' + s.toFixed(2) + '%"></i>' +
      '<i class="rest" style="width:' + (100 - s).toFixed(2) + '%"></i>' +
    '</div>' +
    '<div class="conc-foot"><span>' + codes.map(esc).join(" · ") + ' — ' + amount + '</span>' +
      '<span>Estate ' + total + '</span></div>' +
  '</div>';
}

function concNarrative(a) {
  const top = a.byRevenue.slice(0, a.conc.n);
  const sameFormat = top.every(o => o.format === top[0].format);
  const cities = [...new Set(top.map(o => (o.location || "").split(",").pop().trim()).filter(Boolean))];
  const parts = [];
  parts.push("The largest " + a.conc.n + " outlets carry " + pct1(a.conc.revShare) +
    " of net revenue and " + pct1(a.conc.conShare) + " of outlet contribution, " +
    (a.conc.conShare > a.conc.revShare
      ? "so they are slightly over-represented in profit relative to their size."
      : "so they are no more profitable, proportionally, than the rest of the estate."));
  if (sameFormat) parts.push("All " + a.conc.n + " are " + esc(top[0].format) + " sites.");
  if (cities.length === 1) parts.push("All " + a.conc.n + " sit in " + esc(cities[0]) + ".");
  return parts.join(" ");
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   8. CHARTS
   ═══════════════════════════════════════════════════════════════════════════ */
function drawCharts(a) {
  const ranked = a.byContrib;                    // best → worst
  const codes  = ranked.map(o => o.code);
  const label  = o => o.code + " · " + o.outlet;

  /* ── 3a. Contribution ranking, drawn from zero ─────────── */
  mountChart("c-rank", {
    type: "bar",
    data: { labels: codes, datasets: [{
      label: "Contribution %",
      data: ranked.map(o => o.contribPct),
      backgroundColor: ranked.map(o => fmtColor(o.format)),
      borderRadius: { topLeft:0, bottomLeft:0, topRight:4, bottomRight:4 },
      borderSkipped: false, barPercentage: .74, categoryPercentage: .9
    }]},
    options: {
      indexAxis: "y",
      layout:{ padding:{ top:14, right:14 } },
      scales: {
        x: Object.assign({}, gridX, { beginAtZero:true, suggestedMax: Math.ceil(Math.max(...ranked.map(o=>o.contribPct))/5)*5,
             ticks:{ color:MUTED, padding:6, callback:v => v + "%" } }),
        y: catY
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(ranked[items[0].dataIndex]),
          label: item => {
            const o = ranked[item.dataIndex];
            return ["Contribution  " + pct1(o.contribPct),
                    "Contribution  " + money(o.contrib),
                    "Net revenue   " + money(o.revenue),
                    "Format        " + o.format];
          }
        }}),
        refLine: { value: a.contribPct, axis:"x", label:"Average " + pct1(a.contribPct) },
        barEndLabels: { text: i => pct1(ranked[i].contribPct) }
      }
    }
  });

  /* ── 3b. Variance from the portfolio average, in bp ────── */
  const bp = ranked.map(o => (o.contribPct - a.contribPct) * 100);
  mountChart("c-rank-var", {
    type: "bar",
    data: { labels: codes, datasets: [{
      label: "Basis points vs average",
      data: bp,
      backgroundColor: bp.map(v => v >= 0 ? "#2a78d6" : "#e34948"),
      borderRadius: 4, borderSkipped: false, barPercentage: .74, categoryPercentage: .9
    }]},
    options: {
      indexAxis: "y",
      layout:{ padding:{ top:8, right:22, left:22 } },
      scales: {
        x: Object.assign({}, gridX, { grid:{ color: c => c.tick.value === 0 ? AXIS : GRID, drawTicks:false },
             ticks:{ color:MUTED, padding:6, callback: v => (v > 0 ? "+" : "") + v + " bp" } }),
        y: catY
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(ranked[items[0].dataIndex]),
          label: item => {
            const o = ranked[item.dataIndex];
            const d = (o.contribPct - a.contribPct) * 100;
            return [(d >= 0 ? "+" : "") + nf0.format(Math.round(d)) + " bp vs average",
                    "Contribution " + pct1(o.contribPct)];
          }
        }}),
        barEndLabels: { text: i => (bp[i] >= 0 ? "+" : "") + nf0.format(Math.round(bp[i])) }
      }
    }
  });

  /* ── 4. Revenue per sq ft ──────────────────────────────── */
  const psf = a.byPsf;
  mountChart("c-psf", {
    type: "bar",
    data: { labels: psf.map(o => o.code), datasets: [{
      label: "Revenue per sq ft",
      data: psf.map(o => o.revPsf),
      backgroundColor: "#2a78d6",
      borderRadius: { topLeft:4, topRight:4 }, borderSkipped: false,
      barPercentage: .72, categoryPercentage: .88
    }]},
    options: {
      layout:{ padding:{ top:18 } },
      scales: {
        y: Object.assign({}, gridX, { beginAtZero:true,
             ticks:{ color:MUTED, padding:6, callback: v => nf0.format(v) } }),
        x: { grid:{ display:false }, border:{ color:AXIS },
             ticks:{ color:INK2, font:{ size:11, weight:"500" } } }
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(psf[items[0].dataIndex]),
          label: item => {
            const o = psf[item.dataIndex];
            return [money2(o.revPsf) + " per sq ft",
                    int0(o.sqft) + " sq ft · " + o.format,
                    "Net revenue " + money(o.revenue)];
          }
        }}),
        refLine: { value: a.revPsf, axis:"y", label:"Estate " + money(a.revPsf) }
      }
    }
  });

  /* ── 7. Occupancy burden ───────────────────────────────── */
  const occ = [...a.outlets].sort(byDesc(o => o.occPct));
  const occOver = o => o.occPct != null && o.occPct > OCCUPANCY_FLAG_PCT;
  mountChart("c-occ", {
    type: "bar",
    data: { labels: occ.map(o => (occOver(o) ? "⚠ " : "") + o.code), datasets: [{
      label: "Occupancy % of revenue",
      data: occ.map(o => o.occPct),
      backgroundColor: occ.map(o => occOver(o) ? CRITICAL : "#2a78d6"),
      borderRadius: { topLeft:4, topRight:4 }, borderSkipped: false,
      barPercentage: .72, categoryPercentage: .88
    }]},
    options: {
      layout:{ padding:{ top:18 } },
      scales: {
        y: Object.assign({}, gridX, { beginAtZero:true,
             suggestedMax: Math.max(OCCUPANCY_FLAG_PCT + 2, ...occ.map(o => o.occPct)) ,
             ticks:{ color:MUTED, padding:6, callback: v => v + "%" } }),
        x: { grid:{ display:false }, border:{ color:AXIS },
             ticks:{ color:INK2, font:{ size:11, weight:"500" } } }
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(occ[items[0].dataIndex]),
          label: item => {
            const o = occ[item.dataIndex];
            return [pct1(o.occPct) + " of net revenue",
                    "Occupancy " + money(o.occupancy),
                    occOver(o) ? "⚠ above the " + pct1(OCCUPANCY_FLAG_PCT) + " threshold"
                               : "Within the " + pct1(OCCUPANCY_FLAG_PCT) + " threshold"];
          }
        }}),
        refLine: { value: OCCUPANCY_FLAG_PCT, axis:"y", color: CRITICAL,
                   label: pct1(OCCUPANCY_FLAG_PCT) + " threshold" }
      }
    }
  });

  /* ── 5. Productivity against profitability ─────────────── */
  mountChart("c-scatter", {
    type: "scatter",
    data: { datasets: a.formats.map(f => ({
      label: f.name,
      data: f.outlets.map(o => ({ x:o.revPsf, y:o.contribPct, label:o.code, o })),
      backgroundColor: fmtColor(f.name),
      borderColor: SURFACE, borderWidth: 2,           // 2px surface ring
      pointRadius: 7, pointHoverRadius: 10, hitRadius: 14
    }))},
    options: {
      layout:{ padding:{ top:16, right:18, left:6 } },
      scales: {
        x: Object.assign({}, gridX, {
          title:{ display:true, text:"Revenue per sq ft (" + CURRENCY_CODE + ")", color:INK2,
                  font:{ size:11.5, weight:"600" }, padding:{ top:8 } },
          ticks:{ color:MUTED, padding:6, callback: v => nf0.format(v) } }),
        y: Object.assign({}, gridX, {
          title:{ display:true, text:"Contribution % of revenue", color:INK2,
                  font:{ size:11.5, weight:"600" }, padding:{ bottom:8 } },
          ticks:{ color:MUTED, padding:6, callback: v => nf1.format(v) + "%" } })
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(items[0].raw.o),
          label: item => {
            const o = item.raw.o;
            return [money2(o.revPsf) + " per sq ft",
                    pct1(o.contribPct) + " contribution",
                    o.format + " · " + int0(o.sqft) + " sq ft · " + int0(o.seats) + " seats",
                    o.location];
          }
        }}),
        pointLabels: { enabled: true },
        refLine: { lines: [
          { value: a.revPsf,     axis:"x", label:"Estate " + money(a.revPsf) + "/sq ft" },
          { value: a.contribPct, axis:"y", label:"Average " + pct1(a.contribPct) }
        ]}
      }
    }
  });

  /* ── 6. Cost structure ─────────────────────────────────── */
  const cost = [
    { key:"cosPct",     label:"Cost of sales",       color:"#2a78d6" },
    { key:"payrollPct", label:"Outlet payroll",      color:"#eb6834" },
    { key:"occPct",     label:"Occupancy",           color:"#1baf7a" },
    { key:"sellingPct", label:"Selling costs",       color:"#eda100" },
    { key:"contribPct", label:"Outlet contribution", color:NEUTRAL   }
  ];
  mountChart("c-cost", {
    type: "bar",
    data: { labels: codes, datasets: cost.map(c => ({
      label: c.label,
      data: ranked.map(o => o[c.key]),
      backgroundColor: c.color,
      borderColor: SURFACE, borderWidth: 1,           // 2px gap between fills
      barPercentage: .78, categoryPercentage: .9
    }))},
    options: {
      indexAxis: "y",
      layout:{ padding:{ right:14 } },
      scales: {
        x: Object.assign({}, gridX, { stacked:true, min:0, max:100,
             ticks:{ color:MUTED, padding:6, stepSize:10, callback: v => v + "%" } }),
        y: Object.assign({}, catY, { stacked:true })
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(ranked[items[0].dataIndex]),
          label: item => {
            const o = ranked[item.dataIndex];
            const c = cost[item.datasetIndex];
            const abs = { cosPct:"cos", payrollPct:"payroll", occPct:"occupancy",
                          sellingPct:"selling", contribPct:"contrib" }[c.key];
            return c.label + "  " + pct1(o[c.key]) + "   (" + money(o[abs]) + ")";
          }
        }})
      }
    }
  });

  /* ── 8. Format comparison, three separate scales ───────── */
  const fmtBar = (id, valueOf, tickFmt, tipFmt) => mountChart(id, {
    type: "bar",
    data: { labels: a.formats.map(f => f.name), datasets: [{
      data: a.formats.map(valueOf),
      backgroundColor: a.formats.map(f => fmtColor(f.name)),
      borderRadius: { topLeft:4, topRight:4 }, borderSkipped: false,
      barPercentage: .6, categoryPercentage: .8
    }]},
    options: {
      layout:{ padding:{ top:14 } },
      scales: {
        y: Object.assign({}, gridX, { beginAtZero:true,
             ticks:{ color:MUTED, padding:6, callback: tickFmt } }),
        x: { grid:{ display:false }, border:{ color:AXIS },
             ticks:{ color:INK2, font:{ size:11.5, weight:"500" } } }
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => a.formats[items[0].dataIndex].name + " (" +
                           a.formats[items[0].dataIndex].count + " outlets)",
          label: item => tipFmt(a.formats[item.dataIndex])
        }})
      }
    }
  });
  fmtBar("c-fmt-contrib", f => f.avgContribPct, v => nf1.format(v) + "%",
         f => ["Average " + pct1(f.avgContribPct), "Revenue-weighted " + pct1(f.wtdContribPct)]);
  fmtBar("c-fmt-psf",  f => f.revPsf,  v => nf0.format(v),
         f => [money2(f.revPsf) + " per sq ft", int0(f.sqft) + " sq ft"]);
  fmtBar("c-fmt-seat", f => f.revPseat, v => nf0.format(v),
         f => [money(f.revPseat) + " per seat", int0(f.seats) + " seats"]);

  /* ── 9. Maturity ───────────────────────────────────────── */
  mountChart("c-maturity", {
    type: "scatter",
    data: { datasets: a.formats.map(f => ({
      label: f.name,
      data: f.outlets.filter(o => o.opened instanceof Date && !isNaN(o.opened))
             .map(o => ({ x:o.opened.getTime(), y:o.contribPct, label:o.code, o })),
      backgroundColor: fmtColor(f.name),
      borderColor: SURFACE, borderWidth: 2,
      pointRadius: 7, pointHoverRadius: 10, hitRadius: 14
    }))},
    options: {
      layout:{ padding:{ top:16, right:18 } },
      scales: {
        x: Object.assign({}, gridX, {
          type:"linear",
          title:{ display:true, text:"Opening date", color:INK2,
                  font:{ size:11.5, weight:"600" }, padding:{ top:8 } },
          ticks:{ color:MUTED, padding:6, maxRotation:0, autoSkipPadding:24,
                  callback: v => dateShort(new Date(v)) } }),
        y: Object.assign({}, gridX, {
          title:{ display:true, text:"Contribution % of revenue", color:INK2,
                  font:{ size:11.5, weight:"600" }, padding:{ bottom:8 } },
          ticks:{ color:MUTED, padding:6, callback: v => nf1.format(v) + "%" } })
      },
      plugins: {
        legend:{ display:false },
        tooltip: Object.assign({}, TOOLTIP, { callbacks:{
          title: items => label(items[0].raw.o),
          label: item => {
            const o = item.raw.o;
            return ["Opened " + dateLong(o.opened),
                    pct1(o.contribPct) + " contribution",
                    money(o.revenue) + " net revenue",
                    o.format];
          }
        }}),
        pointLabels: { enabled: true },
        refLine: { lines: [{ value: a.contribPct, axis:"y",
                             label:"Average " + pct1(a.contribPct) }] }
      }
    }
  });
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   9. FULL OUTLET TABLE — every column from the tab, sortable
   ═══════════════════════════════════════════════════════════════════════════ */
const TABLE_COLS = [
  { key:"code",       label:"Code",                text:true,  fmt:o => o.code },
  { key:"outlet",     label:"Outlet",              text:true,  fmt:o => o.outlet },
  { key:"location",   label:"Location",            text:true,  fmt:o => o.location },
  { key:"format",     label:"Format",              text:true,  fmt:o => o.format },
  { key:"opened",     label:"Opened",              text:true,  fmt:o => dateLong(o.opened),
                                                   val:o => o.opened ? o.opened.getTime() : null },
  { key:"sqft",       label:"Sq ft",               fmt:o => int0(o.sqft) },
  { key:"seats",      label:"Seats",               fmt:o => int0(o.seats) },
  { key:"revenue",    label:"Net revenue",         fmt:o => money(o.revenue) },
  { key:"cos",        label:"Cost of sales",       fmt:o => money(o.cos) },
  { key:"gp",         label:"Gross profit",        fmt:o => money(o.gp) },
  { key:"gpPct",      label:"GP %",                fmt:o => pct1(o.gpPct) },
  { key:"payroll",    label:"Outlet payroll",      fmt:o => money(o.payroll) },
  { key:"occupancy",  label:"Occupancy",           fmt:o => money(o.occupancy) },
  { key:"selling",    label:"Selling costs",       fmt:o => money(o.selling) },
  { key:"contrib",    label:"Outlet contribution", fmt:o => money(o.contrib) },
  { key:"contribPct", label:"Contribution %",      fmt:o => pct1(o.contribPct) },
  { key:"revPsf",     label:"Revenue per sq ft",   fmt:o => money2(o.revPsf) }
];

let sortState = { key:"contribPct", dir:-1 };

function renderTable(a) {
  const head = document.getElementById("outlet-head");
  const body = document.getElementById("outlet-body");
  if (!head || !body) return;

  head.innerHTML = TABLE_COLS.map(c => {
    const on = sortState.key === c.key;
    return '<th class="' + (c.text ? "txt " : "") + (on ? "sorted" : "") +
      '" data-key="' + c.key + '" scope="col" role="button" tabindex="0" ' +
      'aria-sort="' + (on ? (sortState.dir === 1 ? "ascending" : "descending") : "none") + '">' +
      esc(c.label) + '<span class="arrow">' + (on ? (sortState.dir === 1 ? "▲" : "▼") : "▲") + '</span></th>';
  }).join("");

  const col = TABLE_COLS.find(c => c.key === sortState.key) || TABLE_COLS[0];
  const valueOf = o => col.val ? col.val(o) : o[col.key];
  const rows = [...a.outlets].sort((x, y) => {
    const vx = valueOf(x), vy = valueOf(y);
    if (vx == null && vy == null) return 0;
    if (vx == null) return 1;
    if (vy == null) return -1;
    if (typeof vx === "string" || typeof vy === "string")
      return String(vx).localeCompare(String(vy)) * sortState.dir;
    return (vx - vy) * sortState.dir;
  });

  body.innerHTML = rows.map(o => {
    const flagged = o.contribPct != null && o.contribPct < CONTRIBUTION_FLAG_PCT;
    const best = o.code === a.best.code;
    const cls = flagged ? "flagged" : best ? "best" : "";
    return '<tr class="' + cls + '">' + TABLE_COLS.map(c => {
      const isCode = c.key === "code";
      const extra = isCode ? " code" : c.key === "contribPct" ? " contrib" : "";
      let inner = esc(c.fmt(o));
      if (isCode) {
        const mark = best ? '<span class="mark" title="Strongest contribution">★</span>'
                   : flagged ? '<span class="mark" title="Below ' + pct1(CONTRIBUTION_FLAG_PCT) + '">⚠</span>' : "";
        inner = '<span class="code-cell">' + mark +
                '<i class="swatch" style="background:' + fmtColor(o.format) + '"></i>' + inner + '</span>';
      }
      return '<td class="' + (c.text ? "txt" : "") + extra + '">' + inner + '</td>';
    }).join("") + '</tr>';
  }).join("");

  head.querySelectorAll("th").forEach(th => {
    const go = () => {
      const k = th.dataset.key;
      const isText = (TABLE_COLS.find(c => c.key === k) || {}).text;
      if (sortState.key === k) sortState.dir *= -1;
      else sortState = { key:k, dir: isText ? 1 : -1 };
      renderTable(a);
    };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   10. CFO OBSERVATIONS — generated from the live figures, so they stay
       true after a refresh. Nothing here is sourced outside the tab.
   ═══════════════════════════════════════════════════════════════════════════ */
const b = s => "<b>" + s + "</b>";
const listCodes = arr => arr.map(o => b(esc(o.code)) + " " + pct1(o.contribPct)).join(", ");

function fyEnd(a) {
  const m = String(a.fy).match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if (m) {
    const d = new Date(m[3] + " " + m[2] + " " + m[1]);
    if (!isNaN(d)) return d;
  }
  const years = a.outlets.map(o => o.opened instanceof Date ? o.opened.getFullYear() : 0);
  const y = Math.max.apply(null, years.concat([0]));
  return y ? new Date(y, 11, 31) : null;
}

function spread(arr, f) {
  const v = arr.map(f).filter(x => x != null && isFinite(x));
  return v.length ? { min: Math.min.apply(null, v), max: Math.max.apply(null, v),
                      range: Math.max.apply(null, v) - Math.min.apply(null, v) } : null;
}

function observations(a) {
  const out = [];
  const o = a.outlets;
  const conSpread = spread(o, x => x.contribPct);
  const cosSpread = spread(o, x => x.cosPct);
  const paySpread = spread(o, x => x.payrollPct);
  const occSpread = spread(o, x => x.occPct);

  /* ── 1. Dispersion of the cost ratios ─────────────────── */
  const tight = conSpread && conSpread.range < 2;
  out.push({
    sev: tight ? "warn" : "good",
    title: tight
      ? "The outlet P&amp;Ls barely differ from one another"
      : "Contribution varies materially across the estate",
    body: tight
      ? "Across " + b(a.count) + " outlets in " + b(a.formats.length) + " formats, contribution runs from " +
        b(pct1(conSpread.min)) + " (" + esc(a.worst.code) + ") to " + b(pct1(conSpread.max)) + " (" +
        esc(a.best.code) + ") &mdash; a total spread of " + b(pct1(conSpread.range)) + " points. " +
        "The cost ratios behind it are tighter still: cost of sales " + b(pct1(cosSpread.min) + "–" + pct1(cosSpread.max)) +
        " of revenue, payroll " + b(pct1(paySpread.min) + "–" + pct1(paySpread.max)) + ", occupancy " +
        b(pct1(occSpread.min) + "–" + pct1(occSpread.max)) + ". " +
        "A " + int0(a.byPsf[a.byPsf.length-1].sqft) + " sq ft site and a " + int0(a.byPsf[0].sqft) +
        " sq ft site in different states are reporting effectively the same rent-to-sales and wage-to-sales ratios."
      : "Contribution runs from " + b(pct1(conSpread.min)) + " (" + esc(a.worst.code) + ") to " +
        b(pct1(conSpread.max)) + " (" + esc(a.best.code) + "), a spread of " + b(pct1(conSpread.range)) +
        " points, with cost of sales between " + b(pct1(cosSpread.min)) + " and " + b(pct1(cosSpread.max)) +
        " of revenue and occupancy between " + b(pct1(occSpread.min)) + " and " + b(pct1(occSpread.max)) + ".",
    ask: tight
      ? "Are these outlet P&amp;Ls built from cost-centre postings that genuinely differ by site, or are group " +
        "ratios being allocated down to outlet level? Until that is settled, the ranking below cannot support " +
        "a close, a renegotiation or a capital decision."
      : "Which of these gaps is structural &mdash; lease, catchment, format &mdash; and which is executional and can be closed this year?"
  });

  /* ── 2. The weakest outlets ───────────────────────────── */
  const bottom = a.byContrib.slice(-Math.min(3, a.count)).reverse();
  const worst = a.worst;
  const worstGap = a.contribPct - worst.contribPct;
  const worstCost = [
    { n:"cost of sales", v:worst.cosPct - a.cosPct },
    { n:"payroll",       v:worst.payrollPct - a.payrollPct },
    { n:"occupancy",     v:worst.occPct - a.occPct },
    { n:"selling costs", v:worst.sellingPct - a.sellingPct }
  ].sort((x, y) => y.v - x.v)[0];
  out.push({
    sev: "bad",
    title: "The weakest outlets, and what is actually costing them",
    body: "The bottom " + bottom.length + " on contribution are " + listCodes(bottom) + ", against a portfolio " +
      "average of " + b(pct1(a.contribPct)) + ". " +
      esc(worst.code) + " (" + esc(worst.outlet) + ", " + esc(worst.location) + ") sits " +
      b(nf0.format(Math.round(worstGap * 100)) + " bp") + " below the average on " + b(money(worst.revenue)) +
      " of revenue, worth " + b(money(worst.revenue * worstGap / 100)) + " of contribution a year if it merely " +
      "reached the estate average. Its largest adverse variance is " + b(worstCost.n) + " at " +
      b(pct1(worst[{ "cost of sales":"cosPct", "payroll":"payrollPct", "occupancy":"occPct", "selling costs":"sellingPct" }[worstCost.n]])) +
      " of revenue against " + b(pct1(a[{ "cost of sales":"cosPct", "payroll":"payrollPct", "occupancy":"occPct", "selling costs":"sellingPct" }[worstCost.n]])) +
      " for the portfolio. " +
      (a.flagged.length === 0
        ? "Note that the " + pct1(CONTRIBUTION_FLAG_PCT) + " board screen catches nobody: every outlet clears it, " +
          "so the threshold is not currently discriminating between sites."
        : b(a.flagged.length) + " outlet" + (a.flagged.length > 1 ? "s" : "") + " fall" +
          (a.flagged.length > 1 ? "" : "s") + " below the " + pct1(CONTRIBUTION_FLAG_PCT) + " board screen."),
    ask: "What is the remediation plan and the deadline for " + esc(worst.code) +
      ", and at what point does the answer become a lease exit rather than a turnaround?"
  });

  /* ── 3. What the strongest have in common ─────────────── */
  const topN = Math.min(5, Math.max(3, Math.round(a.count / 3)));
  const top = a.byContrib.slice(0, topN);
  const tally = {};
  top.forEach(x => tally[x.format] = (tally[x.format] || 0) + 1);
  const domFormat = Object.keys(tally).sort((x, y) => tally[y] - tally[x])[0];
  const domCount = tally[domFormat];
  const domInfo = a.formats.find(f => f.name === domFormat);
  const others = a.formats.filter(f => f.name !== domFormat);
  const otherRev = sum(others, f => f.revenue);
  const otherAvg = others.length ? sum(others, f => f.avgContribPct * f.count) / sum(others, f => f.count) : null;
  const lines = [
    { n:"cost of sales", k:"cosPct" }, { n:"payroll", k:"payrollPct" },
    { n:"occupancy", k:"occPct" },     { n:"selling costs", k:"sellingPct" }
  ].map(l => {
    const inTop = mean(top, x => x[l.k]);
    const inRest = mean(a.byContrib.slice(topN), x => x[l.k]);
    return { n:l.n, k:l.k, top:inTop, rest:inRest, delta:(inRest - inTop) };
  }).sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  const driver = lines[0];
  const sizeTop = mean(top, x => x.sqft), sizeRest = mean(a.byContrib.slice(topN), x => x.sqft);
  out.push({
    sev: "good",
    title: "What the strongest outlets have in common is format, not size or city",
    body: b(domCount + " of the top " + topN) + " outlets by contribution are " + b(esc(domFormat)) + " sites (" +
      listCodes(top) + "). " + esc(domFormat) + " averages " + b(pct1(domInfo.avgContribPct)) +
      " contribution against " + b(pct1(otherAvg)) + " for the rest of the estate. " +
      "The gap is not gross margin &mdash; GP runs " + b(pct1(spread(o, x => x.gpPct).min) + "–" + pct1(spread(o, x => x.gpPct).max)) +
      " everywhere. It is " + b(driver.n) + ": " + b(pct1(driver.top)) + " of revenue in the top " + topN +
      " against " + b(pct1(driver.rest)) + " in the remainder, a " +
      b(nf0.format(Math.round(Math.abs(driver.delta) * 100)) + " bp") + " difference that accounts for most of the " +
      b(nf0.format(Math.round((mean(top, x => x.contribPct) - mean(a.byContrib.slice(topN), x => x.contribPct)) * 100)) + " bp") +
      " contribution gap. Scale is not the explanation: the top " + topN + " average " + b(int0(sizeTop) + " sq ft") +
      " and the rest " + b(int0(sizeRest) + " sq ft") + ", yet space productivity runs the other way.",
    ask: "If " + driver.n + " is the whole difference, is it a genuine format effect &mdash; catchment, basket, " +
      "promotional intensity &mdash; or a difference in how the line is coded between site types? " +
      "If it is real, what stops us applying the " + esc(domFormat) + " playbook to the other " +
      (a.count - domInfo.count) + " outlets?"
  });

  /* ── 4. Space productivity ────────────────────────────── */
  const bestPsf = a.byPsf[0];
  const bestPsfFmt = a.formats.find(f => f.name === bestPsf.format);
  const psfLead = bestPsfFmt.revPsf / a.revPsf;
  out.push({
    sev: "warn",
    title: "The most productive space is the least profitable space",
    body: b(esc(bestPsf.format)) + " sites turn " + b(money(bestPsfFmt.revPsf) + " per sq ft") + ", " +
      b(nf1.format(psfLead) + "×") + " the estate average of " + b(money(a.revPsf)) + " &mdash; " +
      esc(bestPsf.code) + " alone runs at " + b(money(bestPsf.revPsf)) + " per sq ft on " +
      b(int0(bestPsf.sqft) + " sq ft") + ". On " + b(pct1(bestPsfFmt.sqft / a.sqft * 100)) +
      " of the estate's floor area the format delivers " + b(pct1(bestPsfFmt.revShare)) + " of revenue. " +
      "It nonetheless sits " + (bestPsfFmt.avgContribPct < a.avgContribPct
        ? b(nf0.format(Math.round((a.avgContribPct - bestPsfFmt.avgContribPct) * 100)) + " bp below")
        : b(nf0.format(Math.round((bestPsfFmt.avgContribPct - a.avgContribPct) * 100)) + " bp above")) +
      " the estate on contribution, at " + b(pct1(bestPsfFmt.avgContribPct)) + ".",
    ask: "If a " + esc(bestPsf.format).toLowerCase() + " earns " + nf1.format(psfLead) +
      "× the revenue per square foot, why does that not convert into contribution &mdash; " +
      "and what is the capital cost per Ringgit of contribution for a " + esc(bestPsf.format).toLowerCase() +
      " against a " + esc(a.formats[0].name).toLowerCase() + "? That is the number that should drive the next site."
  });

  /* ── 5. Maturity and the part-year outlets ────────────── */
  const dated = o.filter(x => x.opened instanceof Date && !isNaN(x.opened))
                 .sort((x, y) => y.opened - x.opened);
  const end = fyEnd(a);
  if (dated.length) {
    const newest = dated[0];
    const mid = dated[Math.floor(dated.length / 2)].opened;
    const older = dated.filter(x => x.opened <= mid), newer = dated.filter(x => x.opened > mid);
    const oldAvg = mean(older, x => x.contribPct), newAvg = mean(newer, x => x.contribPct);
    const fyStart = end ? new Date(end.getFullYear(), 0, 1) : null;
    const partYear = fyStart && newest.opened > fyStart;
    const days = partYear ? Math.round((end - newest.opened) / 86400000) + 1 : null;
    const annual = partYear && days ? newest.revenue * 365 / days : null;
    const peerFmt = a.formats.find(f => f.name === newest.format);
    out.push({
      sev: partYear ? "warn" : "good",
      title: partYear
        ? "One outlet traded a part year and is not comparable on this page"
        : "The newer outlets are not visibly still ramping",
      body: (partYear
        ? b(esc(newest.code)) + " (" + esc(newest.outlet) + ") opened " + b(dateLong(newest.opened)) +
          " and therefore traded roughly " + b(int0(days) + " days") + " of the year. Its " +
          b(money(newest.revPsf) + " per sq ft") + " is the lowest in the estate and " +
          b(pct1((1 - newest.revPsf / peerFmt.revPsf) * 100)) + " below the " + esc(newest.format) +
          " average of " + b(money(peerFmt.revPsf)) + ". Annualised on days traded it would be about " +
          b(money(annual / newest.sqft) + " per sq ft") + " &mdash; still the " +
          (annual / newest.sqft < a.revPsf ? "bottom of the estate" : "middle of the estate") +
          ". Its contribution of " + b(pct1(newest.contribPct)) + " is nevertheless " +
          (newest.contribPct >= peerFmt.avgContribPct ? "above" : "below") + " its format average of " +
          b(pct1(peerFmt.avgContribPct)) + ". "
        : "") +
        "Across the estate, outlets opened on or before " + b(dateShort(mid)) + " average " +
        b(pct1(oldAvg)) + " contribution against " + b(pct1(newAvg)) + " for those opened after &mdash; a " +
        b(nf0.format(Math.round(Math.abs(oldAvg - newAvg) * 100)) + " bp") + " difference. " +
        (Math.abs(oldAvg - newAvg) < 0.5
          ? "That is too small to read as a ramp curve; on this data, maturity is not visibly driving contribution."
          : "That is consistent with newer sites still ramping."),
      ask: partYear
        ? "Should " + esc(newest.code) + " be shown annualised, or excluded from the ranking, before the board " +
          "uses this page to compare sites? And what is its run-rate contribution on the last full quarter?"
        : "If maturity is not driving contribution, what is the payback assumption in the new-site model, " +
          "and does the FY2025 evidence support it?"
    });
  }

  /* ── 6. Concentration ─────────────────────────────────── */
  const topRev = a.byRevenue.slice(0, a.conc.n);
  const cities = {};
  o.forEach(x => {
    const city = (x.location || "").split(",").pop().trim() || "Unstated";
    cities[city] = (cities[city] || 0) + x.revenue;
  });
  const biggestCity = Object.keys(cities).sort((x, y) => cities[y] - cities[x])[0];
  const cityShare = cities[biggestCity] / a.revenue * 100;
  const cityCount = o.filter(x => (x.location || "").split(",").pop().trim() === biggestCity).length;
  out.push({
    sev: cityShare > 40 ? "bad" : "warn",
    title: "Revenue is concentrated by site and more so by geography",
    body: "The largest " + a.conc.n + " outlets (" + topRev.map(x => b(esc(x.code))).join(", ") + ") carry " +
      b(pct1(a.conc.revShare)) + " of net revenue and " + b(pct1(a.conc.conShare)) + " of outlet contribution &mdash; " +
      b(money(a.conc.conAmount)) + " of the " + b(money(a.contrib)) + " the estate generates before overhead. " +
      "The sharper exposure is geographic: " + b(int0(cityCount) + " outlets") + " in " + b(esc(biggestCity)) +
      " account for " + b(pct1(cityShare)) + " of revenue. " +
      (topRev.every(x => x.format === topRev[0].format)
        ? "All " + a.conc.n + " of the largest sites are " + esc(topRev[0].format) + " format, so site, format and " +
          "geography risk are the same risk, not three."
        : ""),
    ask: "What is the group's downside if " + esc(topRev[0].code) + " loses its lease at renewal, and " +
      "how much of the FY2026 new-site pipeline is outside " + esc(biggestCity) + "?"
  });

  return out;
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   11. CONTROLLER — load, refresh, and never leave a blank page
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
let busy = false;
let lastGood = null;

function setBusy(on) {
  busy = on;
  const btn = $("refresh");
  btn.disabled = on;
  btn.classList.toggle("loading", on);
  btn.querySelector(".txt").textContent = on ? "Refreshing…" : "Refresh data";
  const rep = $("report");
  if (lastGood) rep.classList.toggle("stale", on);   // hold the old render, no skeleton flash
}

function clearStates() { $("states").innerHTML = ""; }

function showSetup() {
  $("loading").hidden = true;
  $("states").innerHTML =
    '<div class="panel setup"><span class="tag">Not configured yet</span>' +
    '<h2>Point this file at your Google Sheet</h2>' +
    '<p>Open this file in a text editor and set the two constants at the top of the script. ' +
    'From a share link of the shape</p>' +
    '<p><code>https://docs.google.com/spreadsheets/d/<b>SHEET_ID</b>/edit?gid=<b>TAB_GID</b></code></p>' +
    '<ul>' +
      '<li><code>SHEET_ID</code> — the long token between <code>/d/</code> and <code>/edit</code>.</li>' +
      '<li><code>TAB_GID</code> — the number after <code>gid=</code> while the <b>Outlet P&amp;L</b> tab is selected. ' +
        'Leave it as it is and the file will fall back to looking the tab up by name (<code>' + esc(TAB_NAME) + '</code>).</li>' +
      '<li>The sheet must be shared <b>Anyone with the link — Viewer</b>.</li>' +
    '</ul>' +
    '<p style="margin-top:12px">You can also try it without editing the file by appending ' +
    '<code>?sheet=&lt;paste the share link&gt;</code> to this page&rsquo;s address.</p></div>';
}

function showError(err) {
  $("loading").hidden = true;
  const kind = (err && err.kind) || "unknown";
  const causes = {
    sharing: [
      "The sheet is not shared publicly. In Google Sheets: <b>Share → General access → Anyone with the link → Viewer</b>. A sheet shared only with named people cannot be read by this page.",
      "The link you took the id from may point to a copy you own but have not shared."
    ],
    network: [
      "<b>The sheet is not shared publicly</b> — this is the usual cause. In Google Sheets: <b>Share → General access → Anyone with the link → Viewer</b>.",
      "The sheet id in <code>SHEET_ID</code> is wrong, or the file has been deleted or moved to a different Drive.",
      "The tab id in <code>TAB_GID</code> does not exist on that sheet — check the <code>gid=</code> number while the <b>Outlet P&amp;L</b> tab is open.",
      "You are offline, or a network policy is blocking <code>docs.google.com</code>."
    ],
    target: [
      "The sheet id is right but the tab is not — check <code>TAB_GID</code> against the <code>gid=</code> number shown while the <b>Outlet P&amp;L</b> tab is selected.",
      "The tab may have been renamed, in which case update <code>TAB_NAME</code> too."
    ],
    timeout: [
      "Google did not respond. Try Refresh; if it keeps failing, check that the sheet is still shared and reachable."
    ],
    header: [
      "The tab was read, but no row in it contains both <b>Outlet</b> and <b>Net revenue</b>.",
      "Check that <code>TAB_GID</code> points at the <b>Outlet P&amp;L</b> tab and not another one, and that the header labels have not been renamed."
    ],
    empty: [
      "The tab was reached but no outlet rows were found below the header. Rows are only read when they carry an outlet code and a positive net revenue, which is what keeps the total and the reconciliation block out."
    ]
  }[kind] || ["An unexpected problem occurred while reading the sheet."];

  $("states").innerHTML =
    '<div class="panel error"><span class="tag">Could not load the sheet</span>' +
    '<h2>' + esc(err && err.message ? err.message : "The sheet could not be read.") + '</h2>' +
    '<p>Most likely one of these:</p><ul>' + causes.map(c => "<li>" + c + "</li>").join("") + '</ul>' +
    (err && err.detail ? '<p style="margin-top:12px"><code>' + esc(err.detail) + '</code></p>' : "") +
    '<p style="margin-top:12px">Nothing on this page is cached from Google, so ' +
    (lastGood ? "the figures below are from the last successful load at " +
       esc(lastGood.stamp) + " and are not being updated."
              : "there is nothing to show until the sheet can be read.") +
    '</p></div>';
}

function stampNow() {
  const d = new Date();
  return d.toLocaleString("en-GB", {
    day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false
  }).replace(",", "") + " " +
  (Intl.DateTimeFormat().resolvedOptions().timeZone || "local time");
}

function render(a) {
  $("m-company").textContent = COMPANY;
  $("m-fy").textContent = a.fy;
  $("m-ccy").textContent = CURRENCY_LONG;
  $("m-count").textContent = int0(a.count) + " trading locations";
  $("m-source").textContent = "Outlet P&L tab, row " + a.headerRow + " header";
  $("foot-src").textContent =
    "Read live from the Outlet P&L tab · header located on row " + a.headerRow +
    " · " + int0(a.count) + " outlets · " + CURRENCY_LONG;

  const rep = $("report");
  rep.innerHTML = buildReport(a);
  rep.hidden = false;
  renderTable(a);
  drawCharts(a);
}

async function load() {
  if (busy) return;
  const target = resolveTarget();
  if (!target.configured) { showSetup(); return; }

  setBusy(true);
  clearStates();
  if (!lastGood) $("loading").hidden = false;

  try {
    const payload = await loadSheet(target);
    const parsed = parseTable(payload);
    const a = analyse(parsed);
    destroyAllCharts();
    $("loading").hidden = true;
    render(a);
    const stamp = stampNow();
    $("m-updated").textContent = stamp;
    lastGood = { a, stamp };
    clearStates();
  } catch (err) {
    console.error(err);
    showError(err instanceof GvizError ? err
      : new GvizError("unknown", err && err.message ? err.message : String(err)));
    if (!lastGood) {
      $("m-updated").textContent = "not loaded";
      $("report").hidden = true;
    }
  } finally {
    setBusy(false);
    $("report").classList.remove("stale");
  }
}

const resizeAll = () => CHARTS.forEach(c => { try { c.resize(); } catch (e) {} });
window.addEventListener("beforeprint", resizeAll);
window.addEventListener("afterprint", resizeAll);
if (window.matchMedia) {
  const mq = window.matchMedia("print");
  if (mq.addEventListener) mq.addEventListener("change", resizeAll);
}

$("refresh").addEventListener("click", load);
window.addEventListener("DOMContentLoaded", load);
if (document.readyState !== "loading") load();
</script>
</body>
</html>
